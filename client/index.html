<!doctype html>
<html lang="en" data-theme="rust">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/x-icon" href="/rust.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Terminal</title>
    </head>
    <body>
        <div id="app"></div>
        <script>
            const savedTheme = localStorage.getItem('theme');

            document.documentElement.setAttribute('data-theme', savedTheme || 'rust');
            document.querySelector("link[rel='icon']").href = '/' + (savedTheme || 'rust') + '.ico';

        </script>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
